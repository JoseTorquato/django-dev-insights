[build-system]
requires = ["setuptools>=77", "wheel"]  # license = "MIT" (PEP 639) needs setuptools 77+
build-backend = "setuptools.build_meta"

[project]
name = "django-dev-insights"
version = "0.3.0"
description = "Real-time performance insights for Django development."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "José Torquato", email = "jltorquato12@gmail.com" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2",
    "colorama>=0.4.0",
]

[project.optional-dependencies]
# what the test suite needs, including the guard's pytest-django and
# pytest-xdist integration tests (used by CI and the release workflow)
test = ["pytest", "pytest-cov", "pytest-django", "pytest-xdist"]

[project.entry-points.pytest11]
# inert until a test uses the dev_insights marker or fixture
dev_insights = "dev_insights.pytest_plugin"

[project.urls]
Homepage = "https://github.com/josetorquato/django-dev-insights"
Repository = "https://github.com/josetorquato/django-dev-insights"
Changelog = "https://github.com/josetorquato/django-dev-insights/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
exclude = ["tests*", "test_project*", "resources*"]

[tool.setuptools.package-data]
dev_insights = ["*.html"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite configures Django itself (tests/conftest.py). pytest-django, if
# installed, would block database access; the plugin's pytest-django
# integration has its own test (test_with_pytest_django_client_and_testcase).
addopts = "-p no:django"
